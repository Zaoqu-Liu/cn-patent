name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract:
    name: Skill contract and tools smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run offline skill contract tests
        run: python tests/test_skill_contract.py

      - name: Compile Python tools
        run: python -m py_compile tools/*.py tests/*.py

      - name: Smoke test Markdown to Word
        run: python tools/md_to_docx.py -i examples/quickstart-case/expected/minimal-disclosure.md -o /tmp/cn-patent-smoke.docx && test -s /tmp/cn-patent-smoke.docx
